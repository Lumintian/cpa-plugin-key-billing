                el("span", { text: "请求结果：" + outcome }),
              ),
            ),
            el("pre", {}, JSON.stringify(row, null, 2)),
          );
        } catch (_) {
          return el("div", { class: "plugin-log-message" }, message);
        }
      }

      function renderPlanKeyPicker(planID) {
        const picker = $("plan-key-picker");
        const keys = state.keys.filter((key) => !key.deleted_at || (planID && key.plan_id === planID));
        if (!keys.length) {
          picker.replaceChildren(el("div", { class: "empty", text: "暂无 API Key" }));

      function planFromForm() {
        let firstInvalid = null;
        const names = new Set(),
          periods = new Set();
        const invalid = (input, message) => {
          input.setAttribute("aria-invalid", "true");
          input.closest(".field").querySelector(".field-error").textContent = message;
          firstInvalid ||= input;
        };
        const windows = Array.from($("plan-windows").children, (row) => {
          row.querySelectorAll("[aria-invalid]").forEach((input) => input.removeAttribute("aria-invalid"));
          row.querySelectorAll(".field-error").forEach((error) => (error.textContent = ""));
          const nameInput = row.querySelector('[name="window_name"]');
          const amountInput = row.querySelector('[name="window_amount"]');
          const periodInput = row.querySelector('[name="window_period"]');
          const name = nameInput.value.trim();
          const amount = amountInput.valueAsNumber;
          const seconds = periodInput.valueAsNumber * Number(row.querySelector("select").value);
          if (!name || new TextEncoder().encode(name).length > 128)
            invalid(nameInput, "名称不能为空且不能超过 128 字节");
          else if (names.has(name.toLowerCase())) invalid(nameInput, "窗口名称重复");
          names.add(name.toLowerCase());
          if (!Number.isFinite(amount) || amount <= 0) invalid(amountInput, "额度必须为正数");
          if (!Number.isInteger(seconds) || seconds <= 0 || seconds > 9223372036)
            invalid(periodInput, "周期须为 1 到 9223372036 秒的整数");
          else if (periods.has(seconds)) invalid(periodInput, "周期与其他窗口重复");
          periods.add(seconds);
          return {
            ...(row.dataset.id ? { id: row.dataset.id } : {}),
            name,
            amount_usd: amount,
            period_seconds: seconds,
          };
        });
        if (firstInvalid) {
          firstInvalid.scrollIntoView({ block: "center" });
          firstInvalid.focus();
          return null;
        }
        return {
          name: $("plan-name").value.trim(),
          windows,
          scopes: Array.from(
            $("plan-key-picker").querySelectorAll('input[type="checkbox"]:checked:not(:disabled)'),
            (input) => input.value,
          ),
        };
      }

      function priceNumber(id, emptyValue = 0) {
        const input = $(id);
        // Check badInput before treating an empty value as an omitted field.
        // Browsers can expose an invalid numeric entry as an empty string.
        if (!input.reportValidity()) throw new Error("请检查模型定价中的数值");
        if (input.value.trim() === "") return emptyValue;
        const value = input.valueAsNumber;
        if (!Number.isFinite(value) || value < 0) {
          input.focus();
          throw new Error("价格必须是有效的非负数");
        }
        return value;
      }

      function refreshPage(reason) {
        const background = reason === "background";
        const generation = sessionGeneration;
        const role = currentRole;
        if (!currentRole || (background && document.hidden)) return Promise.resolve();
        if (pageRefreshPromise) {
          if (background) return pageRefreshPromise;
          if (!queuedForegroundRefresh) {
            setRefreshButtonsDisabled(true);
            queuedForegroundRefresh = pageRefreshPromise.then(() => {
              if (generation !== sessionGeneration) return;
              queuedForegroundRefresh = null;
              if (!currentRole) {
                setRefreshButtonsDisabled(false);
                return undefined;
              }
              return refreshPage("foreground");
            });
          }
          return queuedForegroundRefresh;
        }
        stopAutoRefresh();
        if (!background) setRefreshButtonsDisabled(true);
        pageRefreshPromise = (async () => {
          try {
            await loadView(currentRole === "account", reason);
          } catch (err) {
            if (generation !== sessionGeneration || err instanceof StaleRequestError) return;
            if (err instanceof AuthError) {
              await deleteCredential(role);
              if (generation === sessionGeneration) showGate(role, err.message);
              return;
            }
            const message = (background ? "自动刷新失败：" : "刷新失败：") + (err.message || err);
            notify(message, "err");
          } finally {
            if (generation === sessionGeneration) {
              pageRefreshPromise = null;
              if (!background && !queuedForegroundRefresh) setRefreshButtonsDisabled(false);
              if (!queuedForegroundRefresh) scheduleAutoRefresh();
            }
          }
        })();
        return pageRefreshPromise;
      }

        if (selected !== "keys") closeRoutePicker();
        writePageRoute("admin", selected);
        for (const tab of TABS) {
          const active = tab.dataset.tab === selected;
          tab.classList.toggle("active", active);
          tab.setAttribute("aria-selected", String(active));
        }
        const visible =
          selected === "settings" ? new Set(["plans", "routes", "prices", "plugin-logs"]) : new Set([selected]);
        for (const section of [
          "keys",
          "analysis",
          "plans",
          "routes",
          "prices",
          "request-events",
          "errors",
          "auth-files",
          "plugin-logs",
        ]) {
          $("tab-" + section).classList.toggle("hidden", !visible.has(section));
        }
        $("shared-time-filter").classList.toggle(
          "hidden",
          !["analysis", "request-events", "errors"].includes(selected),
        );
        $("request-events-export").classList.toggle("hidden", selected !== "request-events");
        if (!["analysis", "request-events", "errors"].includes(selected)) {
          closeSharedTimePopover(false);
        }
        schedulePageTabLayout();
        if (currentRole === "admin") {
          renderAdminTab(selected);
        }
        revealTab(document.querySelector(`[data-tab="${selected}"]`));
      }
      for (const tab of TABS)
        tab.onclick = () => {
          if (activeTab(false) === tab.dataset.tab) return;
          setAdminTab(tab.dataset.tab);
          guard(() => loadView(false));
        };

      $("key-filter").addEventListener("input", renderKeys);
      $("keys-include-deleted").addEventListener("change", () => {
        saveChoice("admin", "keys-include-deleted");
        renderKeys();
      });
      $("plan-window-add").onclick = () => addPlanWindow().querySelector("input").focus();
      $("plan-new").onclick = () => {
        resetPlanForm();
        $("plan-dialog").showModal();
        $("plan-name").focus();
      };
      $("plan-cancel").onclick = () => $("plan-dialog").close();
      $("plan-save").onclick = async () => {
        if ($("plan-save").disabled) return;
        const plan = planFromForm();
        if (!plan) return;
        const id = $("plan-id").value;
        const existing = state.plans.find((entry) => entry.id === id);
        const affected = (existing?.windows || []).filter(
          (old) =>
            !plan.windows.some(
              (quotaWindow) => quotaWindow.id === old.id && quotaWindow.period_seconds === old.period_seconds,
            ),
        );
        $("plan-save").disabled = true;
        $("plan-form-error").textContent = "";
        try {
          if (
            affected.length &&
            !(await confirmAction(
              "更新额度周期？",
              "以下窗口的当前周期和消费将清零：" +
                affected.map((quotaWindow) => quotaWindow.name).join("、") +
                "。所有绑定 Key 均受影响，包括已删除 Key；请求事件及其统计不受影响。",
            ))
          )
            return;
          if (id) await mutateAdmin("PATCH", "/plans", { id, ...plan });
          else await mutateAdmin("POST", "/plans", plan);
          notify(id ? "订阅计划已保存" : "订阅计划已创建");
          $("plan-dialog").close();
        } catch (error) {
          $("plan-form-error").textContent = error.message || String(error);
        } finally {
          $("plan-save").disabled = false;
        }
      };

      $("route-picker-search").addEventListener("input", () => {
        const searching = !!$("route-picker-search").value.trim();
        if (searching && !routePicker.searching) {
          routePicker.beforeSearch = { ...routePicker.expanded };
          routePicker.expanded = { routes: true, credentials: true, models: true };
        }
        if (!searching && routePicker.searching && routePicker.beforeSearch)
          routePicker.expanded = routePicker.beforeSearch;
        routePicker.searching = searching;
        renderRoutePicker();
      });
      $("route-picker-cancel").onclick = closeRoutePicker;
      $("route-picker-save").onclick = () => guard(saveRoutePicker);
      $("route-picker-clear").onclick = () => {
        routePicker.routeIDs.clear();
        routePicker.models.clear();
        routePicker.credentialIDs.clear();
        routePicker.credentialProviders = [];
        renderRoutePicker();
      };
      addEventListener("scroll", positionRoutePicker, { passive: true, capture: true });
      addEventListener("resize", positionRoutePicker);
      addEventListener(
        "pointerdown",
        (event) => {
          if (!routePicker.scope) return;
          if (
            $("route-picker").contains(event.target) ||
            (routePicker.anchor && routePicker.anchor.contains(event.target))
          )
            return;
          closeRoutePicker();
        },
        true,
      );
      addEventListener("keydown", (event) => {
        if (event.key === "Escape" && routePicker.scope) closeRoutePicker();
      });

      $("route-rule-search").addEventListener("input", () => {
        renderRouteModelList();
        renderRouteCredentialList();
      });
      $("route-credential-enabled-only").addEventListener("change", () => {
        saveChoice("admin", "route-credential-enabled-only");
        renderRouteCredentialList();
      });
      $("route-rule-all").onclick = () => {
        routeModels = new Set(currentModelIDs());
        routeCredentialIDs = new Set();
        routeProviders = routeProviderChoices(routeProviders).map((item) => ({
          source: item.source,
          provider: item.provider,
        }));
        renderRouteModelList();
        renderRouteCredentialList();
      };
      $("route-rule-none").onclick = () => {
        routeModels = new Set();
        routeCredentialIDs = new Set();
        routeProviders = [];
        renderRouteModelList();
        renderRouteCredentialList();
      };
      $("route-new").onclick = () => {
        resetRouteForm();
        $("route-dialog").showModal();
        $("route-name").focus();
      };
      $("route-cancel").onclick = () => $("route-dialog").close();
      $("route-dialog").addEventListener("close", resetRouteForm);
      $("route-save").onclick = () =>
        guard(async () => {
          const button = $("route-save");
          button.disabled = true;
          const originalText = button.textContent;
          button.textContent = "正在保存…";
          try {
            const name = $("route-name").value.trim();
            if (!name) throw new Error("请输入规则名称");
            const id = $("route-id").value;
            const rule = {
              models: [...routeModels],
              credential_ids: [...routeCredentialIDs],
              credential_providers: routeProviders,
            };
            const scopes = selectedRouteScopes();
            if (id) {
              const route = state.routes.find((item) => item.id === id);
              if (
                route?.bound_key_count &&
                !(await confirmAction(
                  "保存路由规则？",
                  "保存后将更新所选 Key 的绑定及规则。" +
                    (route.deleted_key_count
                      ? "已删除 Key 也会按本次勾选结果保留或解除绑定；保留绑定的 Key 重新加入时使用更新后的规则。"
                      : ""),
                ))
              )
                return;
              await mutateAdmin("PATCH", "/routes", { id, name, rule, scopes });
            } else await mutateAdmin("POST", "/routes", { name, rule, scopes });
            notify(id ? "路由规则已保存" : "路由规则已创建");
            $("route-dialog").close();
          } finally {
            button.disabled = false;
            if ($("route-dialog").open) button.textContent = originalText;
          }
        });

      $("plugin-log-filter").addEventListener("input", renderPluginLogs);
      $("plugin-log-level").addEventListener("change", () => {
        saveChoice("admin", "plugin-log-level");
        pagedList("logs").reset();
        guard(() => pagedList("logs").load());
      });
      $("plugin-logs-clear").onclick = () =>
        guard(async () => {
          if (
            !(await confirmAction("清空全部插件日志？", "该操作只清除插件自身的运行记录，不影响计费数据，且无法恢复。"))
          )
            return;
          const result = await mutateAdmin("DELETE", "/plugin-logs");
          notify("已清空 " + result.cleared + " 条插件日志");
        });
      for (const account of [false, true]) {
        const role = account ? "account" : "admin";
        const prefix = account ? "account-" : "";
        bindPagedListFilters(
          pagedList("events", account),
          role,
          REQUEST_EVENT_FILTER_IDS[role],
          $(prefix + "request-events-filter-clear"),
        );
        bindPagedListFilters(
          pagedList("errors", account),
          role,
          ["error-model", "error-source", "error-type"].map((id) => prefix + id),
          $(prefix + "errors-filter-clear"),
        );
        const exportButton = $(account ? "account-request-events-export" : "request-events-export");
        setLabeledActionIcon(exportButton, "download", "导出");
        exportButton.onclick = () => guard(() => exportRequestEvents(account));
        bindSharedTimeControls(account);
        updateSharedTimeControl(account);
      }
      addEventListener(
        "pointerdown",
        (event) => {
          for (const account of [false, true]) {
            const popover = $(sharedTimeID(account, "popover"));
            if (
              !popover.classList.contains("hidden") &&
              !popover.contains(event.target) &&
              !$(sharedTimeID(account, "trigger")).contains(event.target)
            ) {
              closeSharedTimePopover(account);
            }
          }
        },
        true,
      );
      addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        closeSharedTimePopover(false, true);
        closeSharedTimePopover(true, true);
      });
      matchMedia("(max-width: 768px)").addEventListener("change", () => {
        closeSharedTimePopover(false);
        closeSharedTimePopover(true);
      });
      $("keys-reset-all").onclick = () =>
        guard(async () => {
          if (
            !(await confirmAction(
              "重置全员订阅额度？",
              "所有未删除且绑定计划的 API Key 将结束全部额度周期，下一次放行开启新周期。请求事件及其统计不受影响。",
            ))
          )
            return;
          const result = await mutateAdmin("POST", "/keys/reset", { mode: "global" });
          notify(result.keys ? "已重置 " + result.keys + " 个 API Key 的额度" : "没有需要重置的额度");
        });
      $("price-filter").addEventListener("input", renderPriceTable);
      $("price-reference-search").addEventListener("input", () => {
        priceReferenceRequest++;
        $("price-reference-results").replaceChildren();
        clearTimeout(priceReferenceTimer);
        priceReferenceTimer = setTimeout(() => {
          priceReferenceTimer = 0;
          searchPriceReferences();
        }, 180);
      });
      $("price-tiered").addEventListener("change", syncPriceTierFields);
      $("price-dlg").addEventListener("close", () => {
        clearTimeout(priceReferenceTimer);
        priceReferenceTimer = 0;
        priceReferenceRequest++;
      });
      async function deleteCustomPrice(row) {
        const model = row.custom_price_model_id || row.model_id;
        const message = "删除 " + model + " 的自定义价后，使用该定价的模型将改用参考价。若无参考价，将无法使用。";
        if (!(await confirmAction("删除自定义价？", message))) return;
        await mutateAdmin("DELETE", "/prices?model_id=" + encodeURIComponent(model));
        notify("已删除自定义价");
      }

      $("price-add").onclick = () => editPrice({ model_id: "", input_per_1m: 0, output_per_1m: 0 });
      $("price-cancel").onclick = () => $("price-dlg").close();
      $("price-save").onclick = () =>
        guard(async () => {
          const model = $("price-model").value.trim();
          if (!model) throw new Error("请输入模型 ID");
          const price = {
            model_id: model,
            input_per_1m: priceNumber("price-in"),
            output_per_1m: priceNumber("price-out"),
            cache_read_per_1m: priceNumber("price-cr", null),
            cache_write_per_1m: priceNumber("price-cw", null),
          };
          if ($("price-tiered").checked) {
            const threshold = priceNumber("price-tier-threshold");
            if (!Number.isSafeInteger(threshold) || threshold <= 0) throw new Error("长上下文阈值必须是有效的正整数");
            price.long_context = {
              threshold_input_tokens: threshold,
              input_per_1m: priceNumber("price-tier-in"),
              output_per_1m: priceNumber("price-tier-out"),
              cache_read_per_1m: priceNumber("price-tier-cr", null),
              cache_write_per_1m: priceNumber("price-tier-cw", null),
            };
          }
          await mutateAdmin("PUT", "/prices", price);
          $("price-dlg").close();
          notify("已保存 " + model + " 的定价");
        });
      $("price-reference-refresh").onclick = () =>
        guard(async () => {
          const button = $("price-reference-refresh");
          button.disabled = true;
          try {
            const result = await mutateAdmin("POST", "/prices/reference/refresh", null, { timeoutMS: 45000 });
            notify(result.changed ? "参考价已更新" : "参考价已是最新");
          } catch (err) {
            if (err instanceof AuthError || err instanceof StaleRequestError) throw err;
            try {
              const status = await plugin("GET", "/prices/reference/status");
              renderReferencePriceStatus(status.metadata);
            } catch (statusError) {
              if (statusError instanceof AuthError || statusError instanceof StaleRequestError) throw statusError;
              throw new Error((err.message || err) + "；参考价状态获取失败：" + (statusError.message || statusError));
            }
            throw err;
          } finally {
            button.disabled = false;
          }
        });

      (async function () {
        const panelKey = readPanelKey();
        document
          .querySelectorAll("[data-lucide-icon]")
          .forEach((placeholder) =>
            placeholder.replaceWith(actionIcon(placeholder.dataset.lucideIcon, placeholder.className)),
          );
        updateThemeButtons();
        try {
          if (embedded && panelKey && initialRoute.role !== "account") {
            await startAdmin(panelKey);
            return;
          }
          const saved = await recalledCredential(loginMode);
          if (!saved) {
            showGate(loginMode, "");
            return;
          }
          $("gate-remember").checked = true;
          if (loginMode === "account") await startAccount(saved);
          else await startAdmin(saved);
        } catch (err) {
          await deleteCredential(loginMode);
          showGate(loginMode, err instanceof AuthError ? err.message : "登录失败：" + (err.message || err));
        }
      })();
    </script>
  </body>
</html>
