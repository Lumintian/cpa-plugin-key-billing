      function authProviderIcon(category) {
        const key = category === "gemini-cli" || category === "gemini-interactions" ? "gemini" : category;
        const markup = AUTH_PROVIDER_ICONS[key];
        if (!markup) return null;
        return el(
          "span",
          { class: "auth-provider-icon", "data-provider": key, "aria-hidden": "true" },
          iconSVG(markup),
        );
      }

      function authUI(account) {
        const prefix = account ? "account-auth" : "auth";
        return {
          owner: account ? accountState : state,
          body: $(prefix + "-files-body"),
          enabledOnly: $(prefix + "-enabled-only"),
          provider: $(prefix + "-provider"),
          search: $(prefix + "-search"),
          bulk: $(prefix + "-refresh-filtered"),
        };
      }

      const AUTH_QUOTA_CACHE_PREFIX = "cpa-key-billing.auth-quotas.v2.";

      function resetAuthQuotaMemory(account) {
        const role = account ? "account" : "admin";
        const owner = account ? accountState : state;
        authQuotaGeneration[role]++;
        owner.authQuotas.clear();
        owner.authQuotaLoading.clear();
        owner.authQuotaErrors.clear();
        const bulk = authUI(account).bulk;
        if (bulk) {
          bulk.dataset.loading = "false";
          setLabeledActionIcon(bulk, "refresh", "更新限额");
        }
      }

      function authQuotaStorageKey(role) {
        const scope = credentialScope[role];
        return scope ? AUTH_QUOTA_CACHE_PREFIX + role + "." + scope : "";
      }

      function persistAuthQuotaCache(account) {
        const role = account ? "account" : "admin";
        const key = authQuotaStorageKey(role);
        if (!key) return;
        const owner = account ? accountState : state;
        try {
          sessionStorage.setItem(key, JSON.stringify({ entries: [...owner.authQuotas] }));
        } catch (_) {}
      }

      function clearCredentialScope(account) {
        const role = account ? "account" : "admin";
        const key = authQuotaStorageKey(role);
        if (key) {
          try {
            sessionStorage.removeItem(key);
          } catch (_) {}
        }
        credentialScope[role] = "";
        resetAuthQuotaMemory(account);
      }

      async function activateCredentialScope(account, credential) {
        const role = account ? "account" : "admin";
        resetAuthQuotaMemory(account);
        credentialScope[role] = "";
        try {
          credentialScope[role] = (await sha256Hex(role + "|" + credential)).slice(0, 32);
        } catch (_) {
          return;
        }
        let cached;
        try {
          cached = JSON.parse(sessionStorage.getItem(authQuotaStorageKey(role)) || "null");
        } catch (_) {
          return;
        }
        if (!Array.isArray(cached?.entries)) return;
        const owner = account ? accountState : state;
        for (const entry of cached.entries) {
          if (Array.isArray(entry) && typeof entry[0] === "string" && entry[1] && typeof entry[1] === "object") {
            owner.authQuotas.set(entry[0], entry[1]);
          }
        }
      }

      function loadAuthFiles(account) {
        account = account === true;
        const load = account ? detailLoads.accountAuthFiles : detailLoads.adminAuthFiles;
        return loadResource(
          load,
          () => (account ? accountAPI("/auth-files") : plugin("GET", "/auth-files")),
          (result) => updateAuthFiles(account, result.files || []),
          () =>
            currentRole === (account ? "account" : "admin") &&
            activeTab(account) === "auth-files" &&
            renderAuthFiles(account),
        );
      }

      function updateAuthFiles(account, files) {
        const role = account ? "account" : "admin";
        const owner = account ? accountState : state;
        const byIndex = new Map(files.map((file) => [file.auth_index, file]));
        const previous = new Map((owner.authFiles || []).map((file) => [file.auth_index, file.cache_revision || ""]));
        const changed = new Set(
          files
            .filter(
              (file) => previous.has(file.auth_index) && previous.get(file.auth_index) !== (file.cache_revision || ""),
            )
            .map((file) => file.auth_index),
        );
        const staleIndex = (index) => {
          const file = byIndex.get(index);
          if (!file || changed.has(index)) return true;
          const result = owner.authQuotas.get(index);
          return !!file.cache_revision && !!result && result.auth_revision !== file.cache_revision;
        };
        const stale = [...owner.authQuotas.keys(), ...owner.authQuotaErrors.keys(), ...owner.authQuotaLoading].some(
          staleIndex,
        );
        owner.authFiles = files;
        if (!stale) return;
        authQuotaGeneration[role]++;
        for (const index of owner.authQuotas.keys()) if (staleIndex(index)) owner.authQuotas.delete(index);
        for (const index of owner.authQuotaErrors.keys()) if (staleIndex(index)) owner.authQuotaErrors.delete(index);
        owner.authQuotaLoading.clear();
        persistAuthQuotaCache(account);
      }

      function authQuotaCacheCurrent(account, owner, generation, index) {
        const role = account ? "account" : "admin";
        const currentOwner = account ? accountState : state;
        return (
          owner === currentOwner &&
          generation === authQuotaGeneration[role] &&
          (owner.authFiles || []).some((file) => file.auth_index === index)
        );
      }

      function authPlanLabel(category, value) {
        const plan = String(value || "").trim();
        if (!plan) return "";
        if (category === "codex") {
          const labels = new Map([
            ["free", "Free"],
            ["plus", "Plus"],
            ["team", "Team"],
            ["pro-5x", "Pro 5x"],
            ["pro-20x", "Pro 20x"],
            ["enterprise", "Enterprise"],
          ]);
          const known = labels.get(plan.toLocaleLowerCase());
          if (known) return known;
        }
        return plan;
      }

      function filteredAuthFiles(account) {
        const ui = authUI(account);
        const provider = ui.provider.value;
        const search = ui.search.value.trim().toLocaleLowerCase();
        return (ui.owner.authFiles || []).filter((file) => {
          if (ui.enabledOnly.checked && file.disabled) return false;
          if (provider && file.category !== provider) return false;
          if (!search) return true;
          const currentPlan = ui.owner.authQuotas.get(file.auth_index)?.plan;
          return [file.name, file.email, currentPlan, file.category].some((value) =>
            String(value || "")
              .toLocaleLowerCase()
              .includes(search),
          );
        });
      }

      function compactResetDate(date) {
        const pad = (part) => String(part).padStart(2, "0");
        return (
          pad(date.getMonth() + 1) +
          "/" +
          pad(date.getDate()) +
          " " +
          pad(date.getHours()) +
          ":" +
          pad(date.getMinutes())
        );
      }

      function compactResetAfter(seconds) {
        if (seconds < 60) return "不到1分钟后";
        if (seconds >= 86400) return Math.floor(seconds / 86400) + "天后";
        if (seconds >= 3600) return Math.floor(seconds / 3600) + "小时后";
        return Math.floor(seconds / 60) + "分钟后";
      }

      function quotaResetMeta(row) {
        const resetAt = row.reset_at ? new Date(row.reset_at) : null;
        if (!resetAt || isNaN(resetAt.getTime())) return { at: "", after: "" };
        const after = Math.max(0, Math.floor((resetAt.getTime() - Date.now()) / 1000));
        return { at: compactResetDate(resetAt), after: compactResetAfter(after) };
      }

      function quotaAmount(row) {
        const hasUsed = row.used !== undefined;
        const hasLimit = row.limit !== undefined;
        if (!hasUsed && !hasLimit) return "";
        const money = row.currency === "USD";
        const format = (value) => (money ? usd(value) : value.toLocaleString("zh-CN", { maximumFractionDigits: 2 }));
        if (hasUsed && hasLimit) return format(row.used) + "/" + format(row.limit);
        return hasUsed ? "已用 " + format(row.used) : "额度 " + format(row.limit);

      const AUTH_QUOTA_TIMEOUT_MS = 65000;
      const AUTH_QUOTA_BATCH_CONCURRENCY = 3;

      async function refreshAuthQuota(file, account, shouldRender = true) {
        const owner = account ? accountState : state;
        const role = account ? "account" : "admin";
        const generation = authQuotaGeneration[role];
        if (owner.authQuotaLoading.has(file.auth_index)) return;
        owner.authQuotaLoading.add(file.auth_index);
        owner.authQuotaErrors.delete(file.auth_index);
        if (shouldRender) renderAuthFiles(account);
        try {
          const path = "/auth-files/quota?auth_index=" + encodeURIComponent(file.auth_index);
          const opts = { timeoutMS: AUTH_QUOTA_TIMEOUT_MS };
          const result = account ? await accountAPI(path, opts) : await plugin("GET", path, null, opts);
          if (authQuotaCacheCurrent(account, owner, generation, file.auth_index)) {
            owner.authQuotas.set(file.auth_index, result);
            persistAuthQuotaCache(account);
          }
        } catch (error) {
          if (authQuotaCacheCurrent(account, owner, generation, file.auth_index)) {
            owner.authQuotaErrors.set(file.auth_index, error.message || String(error));
          }
        } finally {
          if (authQuotaCacheCurrent(account, owner, generation, file.auth_index)) {
            owner.authQuotaLoading.delete(file.auth_index);
            if (shouldRender) renderAuthFiles(account);
          }
        }
      }

      async function refreshFilteredAuthQuotas(account) {
        const ui = authUI(account);
        const role = account ? "account" : "admin";
        const generation = authQuotaGeneration[role];
        const files = filteredAuthFiles(account).filter(
          (file) => file.quota_supported && !ui.owner.authQuotaLoading.has(file.auth_index),
        );
        if (!files.length || ui.bulk.dataset.loading === "true") return;
        ui.bulk.dataset.loading = "true";
        ui.bulk.disabled = true;
        let next = 0;
        let completed = 0;
        try {
          const worker = async () => {
            while (next < files.length) {
              const file = files[next++];
              await refreshAuthQuota(file, account, false);
              if (generation !== authQuotaGeneration[role]) return;
              completed++;
              setLabeledActionIcon(ui.bulk, "refresh", "更新中 " + completed + " / " + files.length);
              renderAuthFiles(account);
            }
          };
          await Promise.all(Array.from({ length: Math.min(AUTH_QUOTA_BATCH_CONCURRENCY, files.length) }, worker));
        } finally {
          if (generation === authQuotaGeneration[role]) {
            ui.bulk.dataset.loading = "false";
            setLabeledActionIcon(ui.bulk, "refresh", "更新限额");
            renderAuthFiles(account);
          }
        }
      }

      async function copyText(text) {
        if (navigator.clipboard?.writeText) {
          try {
            await navigator.clipboard.writeText(text);
            return;
          } catch (_) {}
        }
        // HTTP origins and embedded pages may lack clipboard access.
        const previousFocus = document.activeElement;
        const input = document.createElement("textarea");
        input.value = text;
        input.readOnly = true;
        input.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0";
        document.body.appendChild(input);
        try {
          input.focus({ preventScroll: true });
          input.select();
          if (!document.execCommand("copy")) throw new Error();
        } catch (_) {
          throw new Error("复制失败，请检查剪贴板权限");
        } finally {
          input.remove();
          previousFocus?.focus({ preventScroll: true });
        }
      }

      async function copyAPIKey(button, view) {
        button.disabled = true;
        try {
          const list = await api("GET", "/v0/management/api-keys", null, { raw: true });
          const salt = "cli-proxy-api:caller-scope:v1\u0000";
          let key = "";
          for (const value of (list && list["api-keys"]) || []) {
            const candidate = String(value || "").trim();
            const scope = await sha256Hex(salt + candidate);
            if (scope === view.scope) {
              key = candidate;
              break;
            }
          }
          if (!key) throw new Error("API Key 已不存在，请刷新列表");
          await copyText(key);
          button.classList.add("copied");
          setActionIcon(button, "check", "已复制");
          setTimeout(() => {
            if (!button.isConnected) return;
            button.classList.remove("copied");
            setActionIcon(button, "copy", "复制 API Key");
          }, 2000);
        } finally {
          button.disabled = false;
        }
      }

        const text = String(raw ?? "").trim();
        if (!/^\d+$/.test(text)) throw new Error("并发限制必须是 0 到 10000 之间的整数");
        const limit = Number(text);
        if (!Number.isSafeInteger(limit) || limit < 0 || limit > 10000) {
          throw new Error("并发限制必须是 0 到 10000 之间的整数");
        }
        await mutateAdmin("POST", "/keys/concurrency", { scope: view.scope, concurrency_limit: limit });
        notify(limit ? "并发限制已更新为 " + limit : "已取消并发限制");
      }

      function credentialLabel(item) {
        if (item.source === "auth-files") return item.provider + "·" + (item.display_name || "未提供邮箱");
        return item.provider + "·" + item.display_name;
      }

      function credentialSourceLabel(source) {
        return source === "auth-files" ? "认证文件" : "AI 供应商";
      }

      function credentialIcon(item) {
        return item.source === "auth-files" ? "file-key" : "key";
      }

      function credentialSourceRank(item) {
        return item.source === "auth-files" ? 0 : 1;
      }

      function compareCredentialProviders(a, b) {
        return credentialSourceRank(a) - credentialSourceRank(b) || a.provider.localeCompare(b.provider);
      }

      function compareCredentials(a, b) {
        return (
          credentialSourceRank(a) - credentialSourceRank(b) ||
          credentialLabel(a).localeCompare(credentialLabel(b), "zh-CN")
        );
      }

      function credentialProviderLabel(item) {
        return credentialSourceLabel(item.source) + "·" + item.provider;
      }

      function sameCredentialProvider(a, b) {
        return a.source === b.source && a.provider === b.provider;
      }

      function hasCredentialProvider(providers, item) {
        return providers.some((provider) => sameCredentialProvider(provider, item));
      }

              .map((id) => ({ text: routeName(id), mono: false }))

                  tag: "整类",

              )
              .concat(
                credentialIDs.map((ref) => {

        $("route-picker").classList.add("hidden");
      }

      function positionRoutePicker() {
        const node = $("route-picker");
        if (!routePicker.anchor || node.classList.contains("hidden")) return;
        const anchorRect = routePicker.anchor.getBoundingClientRect();
        const rect = node.getBoundingClientRect();
        const margin = 8;
        let left = anchorRect.left;
        if (left + rect.width > innerWidth - margin) left = innerWidth - rect.width - margin;
        let top = anchorRect.bottom + 4;
        if (top + rect.height > innerHeight - margin) {
          const above = anchorRect.top - rect.height - 4;
          top = above >= margin ? above : Math.max(margin, innerHeight - rect.height - margin);
        }
        node.style.left = Math.round(Math.max(margin, left)) + "px";
        node.style.top = Math.round(top) + "px";
      }

      function pickerOption(checked, kind, label, note, onToggle, options = {}) {
        const { iconName, disabledReason, badge } = options;
        const disabled = !!disabledReason;
        return el(
          "label",
          {
            class: "route-picker-option " + kind + (disabled ? " disabled" : ""),
            title: disabled ? disabledReason : null,
          },
          el("input", {
            type: "checkbox",
            checked: checked || undefined,
            disabled: disabled || undefined,
            onchange: (event) => onToggle(event.target.checked),
          }),
          iconName ? actionIcon(iconName) : null,
          el("span", { title: label }, label),
          kind === "credential-provider"
            ? el("span", { class: "tag warn settings-item-chip", text: "整类" })
            : badge
              ? el("span", { class: "tag plain settings-item-chip", text: badge })
              : null,
          note ? el("span", { class: "count" }, note) : null,
        );
      }

      function renderRoutePicker() {
        const term = $("route-picker-search").value.trim().toLowerCase();
        const list = $("route-picker-list");
        const sections = [];

        const routeOptions = [];
        for (const route of state.routes) {
          if (!matchesTerm(route.name || route.id, term)) continue;
          routeOptions.push(
            pickerOption(routePicker.routeIDs.has(route.id), "route", route.name || route.id, "自定义", (checked) => {
              if (checked) routePicker.routeIDs.add(route.id);
              else routePicker.routeIDs.delete(route.id);
              renderRoutePicker();
            }),
          );
        }
        for (const id of routePicker.routeIDs)
          if (!state.routes.some((route) => route.id === id) && matchesTerm(id, term))
            routeOptions.push(
              pickerOption(true, "route", "路由规则已不存在，请重新选择", id, (checked) => {
                if (!checked) routePicker.routeIDs.delete(id);
                renderRoutePicker();
              }),
            );
        sections.push(pickerSection("routes", "路由规则", routeOptions, term ? "没有匹配的路由规则" : "暂无路由规则"));

        for (const item of state.credentials) {
          if (hasCredentialProvider(routePicker.credentialProviders, item)) routePicker.credentialIDs.delete(item.ref);
        }
        const credentialOptions = routeProviderChoices(routePicker.credentialProviders)
          .filter((item) => !routePicker.enabledOnly || item.available)
          .filter((item) => matchesTerm(credentialProviderLabel(item) + " 整类 类别", term))
          .map((item) => {
            const label = credentialProviderLabel(item);
            return pickerOption(
              hasCredentialProvider(routePicker.credentialProviders, item),
              "credential-provider",
              label,
              credentialProviderAvailabilityNote(item),
              (checked) => {
                if (checked) routePicker.credentialProviders.push({ source: item.source, provider: item.provider });
                else
                  routePicker.credentialProviders = routePicker.credentialProviders.filter(
                    (provider) => !sameCredentialProvider(provider, item),
                  );
                renderRoutePicker();
              },
              { iconName: credentialIcon(item) },
            );
          });
        credentialOptions.push(
          ...state.credentials
            .filter((item) => (!routePicker.enabledOnly || !item.disabled) && matchesTerm(credentialLabel(item), term))
            .sort(compareCredentials)
            .map((item) => {
              const covered = hasCredentialProvider(routePicker.credentialProviders, item);
              const disabledReason = covered
                ? "已选择「" + credentialProviderLabel(item) + "」整类，该类别下的单个凭证无需重复选择。"
                : "";
              return pickerOption(
                routePicker.credentialIDs.has(item.ref),
                "credential",
                credentialLabel(item),
                item.unavailable ? "不可用" : "",
                (checked) => {
                  if (checked) routePicker.credentialIDs.add(item.ref);
                  else routePicker.credentialIDs.delete(item.ref);
                  renderRoutePicker();
                },
                { iconName: credentialIcon(item), disabledReason, badge: item.disabled ? "已停用" : "" },
              );
            }),
        );
        for (const ref of routePicker.credentialIDs) {
          if (state.credentials.some((item) => item.ref === ref) || !matchesTerm(ref, term)) continue;
          credentialOptions.push(
            pickerOption(
              true,
              "credential",
              "上游凭证已不存在",
              ref.slice(0, 16) + "…",
              (checked) => {
                if (!checked) routePicker.credentialIDs.delete(ref);
                renderRoutePicker();
              },
              { iconName: "key" },
            ),
          );
        }
        sections.push(
          pickerSection("credentials", "上游凭证", credentialOptions, term ? "没有匹配的上游凭证" : "暂无上游凭证"),
        );

        const modelOptions = currentModelIDs()
          .filter((model) => matchesTerm(model, term))
          .map((model) => {
            return pickerOption(routePicker.models.has(model), "model", model, "", (checked) => {
              if (checked) routePicker.models.add(model);
              else routePicker.models.delete(model);
              renderRoutePicker();
            });
          });
        for (const model of routePicker.models)
          if (!currentModelIDs().some((item) => item.toLowerCase() === model.toLowerCase()) && matchesTerm(model, term))
            modelOptions.push(
              pickerOption(true, "model", model, "不在 CPA 模型列表中", (checked) => {
                if (!checked) routePicker.models.delete(model);
                renderRoutePicker();
              }),
            );
        sections.push(pickerSection("models", "模型", modelOptions, term ? "没有匹配的模型" : "暂无模型"));

        list.replaceChildren(...sections);
        positionRoutePicker();
      }

      function pickerSection(kind, title, options, emptyText) {
        const selected =
          kind === "routes"
            ? routePicker.routeIDs.size
            : kind === "credentials"
              ? routePicker.credentialIDs.size + routePicker.credentialProviders.length
              : routePicker.models.size;
        const expanded = !!routePicker.expanded[kind];
        return el(
          "div",
          { class: "route-picker-section" },
          el(
            "div",
            { class: "route-picker-group" },
            el(
              "button",
              {
                type: "button",
                class: "route-picker-group-toggle",
                "aria-label": (expanded ? "收起" : "展开") + title,
                "aria-expanded": String(expanded),
                onclick: () => {
                  routePicker.expanded[kind] = !expanded;
                  renderRoutePicker();
                },
              },
              el("span", { class: "route-picker-chevron", "aria-hidden": "true" }, actionIcon("chevron")),
              el("span", { text: title }),
            ),
            kind === "credentials"
              ? compactEnabledToggle(
                  routePicker.enabledOnly,
                  (checked) => {
                    routePicker.enabledOnly = checked;
                    saveViewPreference("admin", "route-picker-enabled-only", checked);
                    renderRoutePicker();
                  },
                  "仅显示启用的上游凭证",
                )
              : null,
            el("span", { class: "route-picker-section-count", text: selected + "/" + options.length }),
          ),
          expanded
            ? el(
                "div",
                {},
                ...(options.length ? options : [el("div", { class: "route-picker-empty", text: emptyText })]),
              )
            : null,
        );
      }

      function compactEnabledToggle(checked, onChange, title) {
        return el(
          "label",
          { class: "toggle-filter compact-toggle", title },
          el("input", {
            type: "checkbox",
            checked: checked || undefined,
            onchange: (event) => onChange(event.target.checked),
          }),
          el("span", { class: "toggle-track", "aria-hidden": "true" }),
          el("span", { text: "仅启用" }),
        );
      }

      async function saveRoutePicker() {
        const scope = routePicker.scope;
        if (!scope) return;
        const body = {
          scope,
          bindings: {
            route_ids: [...routePicker.routeIDs],
            models: [...routePicker.models],
            credential_ids: [...routePicker.credentialIDs],
            credential_providers: routePicker.credentialProviders,
          },
        };
        const button = $("route-picker-save");
        button.disabled = true;
        button.textContent = "正在保存…";
        try {
          await mutateAdmin("PUT", "/keys/routes", body);
          notify("API Key 路由规则已保存");
          closeRoutePicker();
          renderAdminAccess();
        } finally {
          button.disabled = false;
          button.textContent = "保存";
        }
      }

      function settingsChipList(items, fallback) {
        if (!items.length) return el("span", { class: fallback === "—" ? "muted" : "", text: fallback });
        return el(
          "div",
          { class: "settings-chip-list" },
          items.map((item) =>
            el(
              "span",
              item.title
                ? {
                    class: "settings-chip settings-item-chip" + (item.tag ? " has-tag" : ""),
                    title: item.title,
                  }
                : { class: "settings-chip settings-item-chip" + (item.tag ? " has-tag" : "") },
              item.tag ? el("span", { class: "settings-chip-label", text: item.text }) : item.text,
              item.tag ? el("span", { class: "tag warn", text: item.tag }) : null,
            ),
          ),
        );
      }

      function settingsEntryField(label, content) {
        return el(
          "div",
          { class: "error-event-field settings-entry-field" },
          el("span", { class: "error-event-field-label", text: label }),
          el("div", { class: "error-event-field-value settings-entry-value" }, content),

      }

      function boundKeyField(keys) {
        const chips = keys.map((key) => ({
          text: apiKeyIdentity(key).text,
          tag: key.deleted_at ? "已删除" : "",

      function bindingSummary(keys) {
        const deleted = keys.filter((key) => key.deleted_at).length;
        return keys.length + " 个 API Key" + (deleted ? "（其中 " + deleted + " 个已删除）" : "");

      function renderRoutes() {
        const inventoryError = state.access?.credential_inventory_error;
        $("route-inventory-notice").textContent = inventoryError ? "凭证信息暂时无法加载：" + inventoryError : "";
        $("route-inventory-notice").classList.toggle("hidden", !inventoryError);
        const routes = state.routes.map((route) => ({
          route,
          boundKeys: state.keys.filter((key) => key.route_bindings.route_ids.includes(route.id)),
        }));
        renderCollection($("routes-body"), routes, {
          key: ({ route }) => route.id,
          attrs: { class: "event-list settings-card-list", role: "list" },
          empty: "暂无路由规则",
          context: state.credentials,
          render: ({ route, boundKeys }) => {
            const rule = route.rule;
            const models = rule.models;
            const credentials = rule.credential_providers
              .map((item) => ({ text: credentialProviderLabel(item), tag: "整类" }))
              .concat(
                rule.credential_ids.map((ref) => {
                  const credential = state.credentials.find((item) => item.ref === ref);
                  return { text: credential ? credentialLabel(credential) : "凭证已不存在" };
                }),
              );
            const name = route.name || route.id;
            return el(
              "article",
              { class: "auth-file-card", role: "listitem" },
              el(
                "div",
                { class: "event-entry-head settings-entry-header" },
                el("div", { class: "settings-entry-title", text: name }),
                el(
                  "div",
                  { class: "row settings-entry-actions" },
                  el("button", { class: "link", text: "编辑", onclick: () => editRoute(route) }),
                  el("button", {
                    class: "link danger",
                    text: "删除",
                    onclick: () =>
                      guard(async () => {
                        if (
                          !(await confirmAction(
                            "删除路由规则「" + name + "」？",
                            boundKeys.length
                              ? "将从 " +
                                  bindingSummary(boundKeys) +
                                  " 的绑定中解除此规则；其中 " +
                                  (route.fully_unrestricted_keys || 0) +
                                  " 个未删除 Key 将不再受模型和凭证限制。已删除 Key 重新加入后按剩余绑定执行。"
                              : "此操作无法撤销。",
                          ))
                        )
                          return;
                        await mutateAdmin("DELETE", "/routes?id=" + encodeURIComponent(route.id));
                        notify("路由规则已删除");
                      }),
                  }),
                ),
              ),
              el(
                "div",
                { class: "settings-entry-fields" },
                settingsEntryField(
                  "模型范围",
                  settingsChipList(
                    models.map((text) => ({ text })),
                    "全部模型",
                  ),
                ),
                settingsEntryField("凭证范围", settingsChipList(credentials, "全部凭证")),
                boundKeyField(boundKeys),
              ),
            );
          },
        });
      }

      let routeModels = new Set();
      let routeCredentialIDs = new Set();
      let routeProviders = [];

      function routeRuleSearchTerm() {
        return $("route-rule-search").value.trim().toLowerCase();
      }

      function routeProviderChoices(selected) {
        const providers = [];
        for (const item of state.credentials) {
          const existing = providers.find((provider) => sameCredentialProvider(provider, item));
          if (existing) {
            existing.available ||= !item.disabled && !item.unavailable;
          } else {
            providers.push({
              source: item.source,
              provider: item.provider,
              available: !item.disabled && !item.unavailable,
              hasCredentials: true,
            });
          }
        }
        for (const item of selected) {
          if (hasCredentialProvider(providers, item)) continue;
          providers.push({ ...item, available: false, hasCredentials: false });
        }
        return providers.sort(compareCredentialProviders);
      }

      function credentialProviderAvailabilityNote(item) {
        if (item.available) return "";
        return item.hasCredentials ? "暂无可用凭证" : "暂无凭证";
      }

      function renderRouteCredentialList() {
        for (const item of state.credentials) {
          if (hasCredentialProvider(routeProviders, item)) routeCredentialIDs.delete(item.ref);
        }
        const term = routeRuleSearchTerm();
        const enabledOnly = $("route-credential-enabled-only").checked;
        const options = routeProviderChoices(routeProviders)
          .filter(
            (item) => (!enabledOnly || item.available) && matchesTerm(credentialProviderLabel(item) + " 整类", term),
          )
          .map((item) => {
            const label = credentialProviderLabel(item);
            return el(
              "label",
              {},
              el("input", {
                type: "checkbox",
                checked: hasCredentialProvider(routeProviders, item) || undefined,
                onchange: (event) => {
                  if (event.target.checked) routeProviders.push({ source: item.source, provider: item.provider });
                  else routeProviders = routeProviders.filter((provider) => !sameCredentialProvider(provider, item));
                  renderRouteCredentialList();
                },
              }),
              actionIcon(credentialIcon(item)),
              el("span", { title: label + "·整类" }, label),
              el("span", { class: "tag warn settings-item-chip", text: "整类" }),
              item.available
                ? null
                : el("span", { class: "muted small", text: credentialProviderAvailabilityNote(item) }),
            );
          });
        const credentials = state.credentials
          .filter((item) => (!enabledOnly || !item.disabled) && matchesTerm(credentialLabel(item), term))
          .sort(compareCredentials);
        for (const item of credentials) {
          const label = credentialLabel(item);
          const covered = hasCredentialProvider(routeProviders, item);
          options.push(
            el(
              "label",
              { class: covered ? "disabled" : "" },
              el("input", {
                type: "checkbox",
                checked: routeCredentialIDs.has(item.ref) || undefined,
                disabled: covered || undefined,
                onchange: (event) => {
                  if (event.target.checked) routeCredentialIDs.add(item.ref);
                  else routeCredentialIDs.delete(item.ref);
                  renderRouteCredentialList();
                },
              }),
              actionIcon(credentialIcon(item)),
              el("span", { title: label }, label),
              item.disabled ? el("span", { class: "tag plain settings-item-chip", text: "已停用" }) : null,
            ),
          );
        }
        for (const ref of routeCredentialIDs)
          if (!state.credentials.some((item) => item.ref === ref) && matchesTerm(ref, term))
            options.push(
              el(
                "label",
                {},
                el("input", {
                  type: "checkbox",
                  checked: true,
                  onchange: (event) => {
                    if (!event.target.checked) routeCredentialIDs.delete(ref);
                    renderRouteCredentialList();
                  },
                }),
                actionIcon("key"),
                el("span", { title: ref }, "凭证已不存在"),
              ),
            );
        $("route-credential-list").replaceChildren(
          ...(options.length ? options : [el("div", { class: "empty", text: "没有匹配项" })]),
        );
        const credentialCount = routeCredentialIDs.size + routeProviders.length;
        $("route-credential-count").textContent = credentialCount ? String(credentialCount) : "全部";
      }

      function renderRouteModelList() {
        const node = $("route-model-list");
        const term = routeRuleSearchTerm();
        const retired = new Set(retiredModels(routeModels));
        const models = currentModelIDs().concat([...retired]);
        $("route-model-count").textContent = routeModels.size ? String(routeModels.size) : "全部";
        const options = models
          .filter((model) => matchesTerm(model, term))
          .map((model) =>
            el(
              "label",
              {},
              el("input", {
                type: "checkbox",
                value: model,
                checked: routeModels.has(model) || undefined,
                onchange: (event) => {
                  if (event.target.checked) routeModels.add(model);
                  else routeModels.delete(model);
                  renderRouteModelList();
                },
              }),
              el("span", { class: "mono", title: model }, model),
              retired.has(model) ? el("span", { class: "muted small", text: "不在 CPA 模型列表中" }) : null,
            ),
          );
        node.replaceChildren(
          ...(options.length
            ? options
            : [
                el("div", {
                  class: "empty",
                  text: currentModelIDs().length ? "没有匹配的模型" : "暂无可选模型",
                }),
              ]),
        );
      }

      function renderRouteKeyList(routeID) {
        const list = $("route-key-list");
        const keys = state.keys.filter(
          (key) => !key.deleted_at || (routeID && key.route_bindings.route_ids.includes(routeID)),
        );
        if (!keys.length) {
          list.replaceChildren(el("div", { class: "empty", text: "暂无 API Key" }));
          return;
        }
        list.replaceChildren(
          ...keys.map((key) => {
            const checked = !!routeID && key.route_bindings.route_ids.includes(routeID);
            return el(
              "label",
              {},
              el("input", { type: "checkbox", value: key.scope, checked: checked || undefined }),
              renderAPIKeyIdentity(key),
              key.deleted_at ? el("span", { class: "tag plain", text: "已删除", title: "可取消勾选以解除绑定" }) : null,
            );
          }),
        );
      }

      function selectedRouteScopes() {
        return Array.from(
          $("route-key-list").querySelectorAll('input[type="checkbox"]:checked:not(:disabled)'),
          (input) => input.value,
        );
      }

      function resetRouteForm() {
        $("route-form-title").textContent = "新建路由规则";
        $("route-save").textContent = "创建";
        $("route-id").value = "";
        $("route-name").value = "";
        $("route-rule-search").value = "";
        restoreChoice("admin", "route-credential-enabled-only", true);
        routeModels = new Set();
        routeCredentialIDs = new Set();
        routeProviders = [];
        renderRouteModelList();
        renderRouteCredentialList();
        renderRouteKeyList("");
      }

      function editRoute(route) {
        $("route-form-title").textContent = "编辑路由规则：" + (route.name || route.id);
        $("route-id").value = route.id;
        $("route-save").textContent = "保存";
        $("route-name").value = route.name || "";
        $("route-rule-search").value = "";
        restoreChoice("admin", "route-credential-enabled-only", true);
        routeModels = new Set(route.rule.models);
        routeCredentialIDs = new Set(route.rule.credential_ids);
        routeProviders = [...route.rule.credential_providers];
        renderRouteModelList();
        renderRouteCredentialList();
        renderRouteKeyList(route.id);
        $("route-dialog").showModal();
        $("route-name").focus();
      }

      function priceSourceTag(source) {
        switch (source) {
          case "custom":
            return el("span", { class: "tag warn", text: "自定义" });
          case "builtin":
            return el("span", { class: "tag ok", text: "内置" });
          case "reference":
            return el("span", { class: "tag ok", text: "参考价" });
          default:
            return el("span", { class: "tag plain", text: "未定价" });
        }
      }

      function priceValue(value) {
        return value === null || value === undefined ? el("span", { class: "muted", text: "—" }) : usd(value);
      }

      function tierPriceCell(row, field) {
        if (row.source === "none") return priceValue(null);
        const base = row[field];
        const tier = row.long_context;
        if (!tier) return priceValue(base);
        const threshold = tokenThreshold(tier.threshold_input_tokens);
        const longValue = tier[field];
        if ((base === null || base === undefined) && (longValue === null || longValue === undefined)) {
          return priceValue(null);
        }
        return el(
          "div",
          { class: "tier-price" },
          el("span", {}, priceValue(base)),
          el("span", { class: "muted small" }, ">" + threshold + " ", priceValue(longValue)),
        );
      }

      // Group prefixed and unprefixed variants by base model name.
      function modelIdParts(modelID) {
        const slash = modelID.indexOf("/");
        if (slash < 0) return { name: modelID, prefix: "" };
        return { name: modelID.slice(slash + 1), prefix: modelID.slice(0, slash) };
      }

      function compareModelId(a, b) {
        const ka = modelIdParts(a);
        const kb = modelIdParts(b);
        if (ka.name !== kb.name) return ka.name < kb.name ? -1 : 1;
        if (ka.prefix !== kb.prefix) return ka.prefix < kb.prefix ? -1 : 1;
        return 0;
      }

      function renderPriceTable() {
        const filter = $("price-filter").value.trim().toLowerCase();
        const rows = (state.prices || [])
          .filter((row) => !filter || row.model_id.toLowerCase().includes(filter))
          .sort((a, b) => compareModelId(a.model_id, b.model_id));
        const renderRow = (row) => {
          return el(
            "tr",
            {},
            el(
              "td",
              { class: "mono" },
              row.model_id,
              row.in_models === false ? el("div", { class: "muted small", text: "不在 CPA 模型列表中" }) : null,
              row.custom_price_model_id && row.custom_price_model_id !== row.model_id
                ? el("div", {
                    class: "muted small",
                    text: "沿用 " + row.custom_price_model_id + " 的自定义价",
                  })
                : null,
            ),
            el("td", { class: "num" }, tierPriceCell(row, "input_per_1m")),
            el("td", { class: "num" }, tierPriceCell(row, "output_per_1m")),
            el("td", { class: "num" }, tierPriceCell(row, "cache_read_per_1m")),
            el("td", { class: "num" }, tierPriceCell(row, "cache_write_per_1m")),
            el("td", {}, priceSourceTag(row.source)),
            el(
              "td",
              { class: "small" },
              el("button", { class: "link", text: "编辑", onclick: () => editPrice(row) }),
              el("button", {
                class: "link danger",
                text: "删除",
                disabled: row.source !== "custom",
                onclick: () => guard(() => deleteCustomPrice(row)),
              }),
            ),
          );
        };
        const headers = [
          "模型",
          { label: "输入 / 1M Token", num: true },
          { label: "输出 / 1M Token", num: true },
          { label: "缓存读 / 1M Token", num: true },
          { label: "缓存写 / 1M Token", num: true },
          "来源",
          "操作",
        ];
        renderCollection($("prices-body"), rows, {
          key: (row) => row.model_id,
          headers,
          render: renderRow,
        });
      }

      function costTierText(cost) {
        const threshold = tokenThreshold(cost.threshold_input_tokens);
        return cost.long_context ? "长上下文 >" + threshold : "标准上下文 ≤" + threshold;
      }

      function showCostTooltip(anchor, cost, reasoningTokens) {
        const tooltip = $("cost-tooltip");
        const input =
          Number(cost.uncached_input_tokens || 0) +
          Number(cost.cache_read_tokens || 0) +
          Number(cost.cache_write_tokens || 0);
        const output = Number(cost.billed_output_tokens || 0);
        const rows = [
          ["未缓存输入", cost.uncached_input_tokens, cost.applied_input_per_1m, cost.uncached_input_usd],
          ["缓存读", cost.cache_read_tokens, cost.applied_cache_read_per_1m, cost.cache_read_usd],
          ["缓存写", cost.cache_write_tokens, cost.applied_cache_write_per_1m, cost.cache_write_usd],
          ["输出", output, cost.applied_output_per_1m, cost.output_usd],
        ];
        tooltip.replaceChildren(
          el("div", { class: "cost-tooltip-title", text: "计价详情" }),
          el(
            "div",
            { class: "cost-tooltip-summary" },
            cost.tiered ? el("span", {}, "档位") : null,
            cost.tiered ? el("b", {}, costTierText(cost)) : null,
            el("span", {}, "输入 Token"),
            el("b", {}, exactTokens(input)),
            el("span", {}, "输出 Token"),
            el("b", {}, exactTokens(output)),
            reasoningTokens ? el("span", {}, "其中推理 Token") : null,
            reasoningTokens ? el("b", {}, exactTokens(reasoningTokens)) : null,
          ),
          el(
            "div",
            { class: "cost-tooltip-grid" },
            el("span", { class: "cost-tooltip-head" }, "项目"),
            el("span", { class: "cost-tooltip-head num" }, "Token / 单价"),
            el("span", { class: "cost-tooltip-head num" }, "金额"),
            rows.flatMap(([name, tokenCount, price, amount]) => [
              el("span", {}, name),
              el("span", { class: "num" }, exactTokens(tokenCount) + " × " + usd(price) + " / 1M"),
              el("span", { class: "num" }, usd(amount)),
            ]),
          ),
          el("div", { class: "cost-tooltip-total" }, el("span", {}, "总金额"), el("span", {}, usd(cost.total_usd))),
        );
        tooltip.classList.add("show");
        tooltip.setAttribute("aria-hidden", "false");
        positionCostTooltip(anchor);
      }

      function positionCostTooltip(anchor) {
        const tooltip = $("cost-tooltip");
        const anchorRect = anchor.getBoundingClientRect();
        const gap = 8;
        const margin = 8;
        let left = anchorRect.right + gap;
        let top = anchorRect.top;
        const rect = tooltip.getBoundingClientRect();
        if (left + rect.width > innerWidth - margin) left = anchorRect.left - rect.width - gap;
        if (left < margin) left = Math.max(margin, innerWidth - rect.width - margin);
        if (top + rect.height > innerHeight - margin) top = innerHeight - rect.height - margin;
        tooltip.style.left = Math.round(left) + "px";
        tooltip.style.top = Math.round(Math.max(margin, top)) + "px";
      }

      function hideCostTooltip() {
        const tooltip = $("cost-tooltip");
        tooltip.classList.remove("show");
        tooltip.setAttribute("aria-hidden", "true");
      }

      const REQUEST_EVENT_STATUS_OPTIONS = {
        "": { label: "全部状态", count: "all" },
        false: { label: "正常", count: "normal" },
        true: { label: "失败", count: "failed" },
      };

      // Counts cover the whole field/time selection and ignore the status choice,
      // so each status option can show how many entries selecting it would reveal.
      function labelRequestEventStatuses(select, counts) {
        for (const option of select.options) {
          const status = REQUEST_EVENT_STATUS_OPTIONS[option.value];
          const label = status.label + "·" + int((counts || {})[status.count]);
          if (option.textContent !== label) option.textContent = label;
        }
      }

      function renderSelectOptions(select, options) {
        const selected = select.value;
        const previous = new Map([...select.options].map((option) => [option.value, option]));
        let position = select.firstChild;
        for (const { value, text } of options) {
          const option = previous.get(value) || el("option", { value });
          if (option.textContent !== text) option.textContent = text;
          if (option !== position) select.insertBefore(option, position);
          position = option.nextSibling;
          previous.delete(value);
        }
        for (const option of previous.values()) option.remove();
        select.value = selected;
        if (select.selectedIndex < 0) select.value = "";
      }

      function populateEventFilterSelect(select, defaultLabel, values, valueOf = (item) => item, labelOf = valueOf) {
        const selected = select.value;
        const selectedLabel = select.selectedOptions[0]?.textContent || selected;
        const options = [{ value: "", text: defaultLabel }];
        let found = !selected;
        for (const item of values || []) {
          const value = String(valueOf(item) || "");
          if (!value) continue;
          if (value === selected) found = true;
          options.push({ value, text: String(labelOf(item)) });
        }
        if (selected && !found) options.push({ value: selected, text: selectedLabel });
        renderSelectOptions(select, options);
      }

      function populateRequestEventFilters(filters, account) {
        if (!filters) return;
        const prefix = account ? "account-request-event" : "request-event";
        populateEventFilterSelect($(prefix + "-model"), "全部模型", filters.models);
        populateEventFilterSelect($(prefix + "-source"), "全部来源", filters.sources, undefined, sourceLabel);
      }

      function timeRangeCacheKey(account, range) {
        const mode = sharedTimeRanges[account ? "account" : "admin"].mode;
        if (mode === "custom") return JSON.stringify([mode, range.from, range.to]);
        // Natural-day ranges change at midnight; rolling ranges share a short TTL.
        return mode === "today" || mode === "yesterday" ? JSON.stringify([mode, range.from]) : mode;
      }

      function loadEventKeys(range) {
        const load = detailLoads.adminEventKeys;
        return loadResource(
          load,
          () => plugin("GET", "/events/keys?" + new URLSearchParams(range)),
          (keys) => {
            const select = $("analysis-key");
            const selected = select.value;
            renderSelectOptions(select, [
              { value: "", text: "全部 API Key" },
              ...keys.map((key) => ({
                value: key.scope,
                text: apiKeyIdentity(key).text + (key.deleted_at ? "（已删除）" : ""),
              })),
            ]);
            if (select.value !== selected) {
              saveChoice("admin", "analysis-key");
              resetEventViews(false);
            }
          },
          undefined,
          { cacheKey: timeRangeCacheKey(false, range) },
        );
      }

      function requestEventPath(cursor, limit, account, range = selectedRange(account)) {
        const params = new URLSearchParams({
          ...cursor,
          limit: String(limit || LIST_PAGE_SIZE),
        });
        const prefix = account ? "account-request-event" : "request-event";
        const key = account ? "" : $("analysis-key").value;
        const model = $(prefix + "-model").value;
        const source = $(prefix + "-source").value;
        const failed = $(prefix + "-status").value;
        if (key) params.set("api_key", key);
        if (model) params.set("model", model);
        if (source) params.set("source", source);
        if (failed) params.set("failed", failed);
        if (range.from) params.set("from", range.from);
        if (range.to) params.set("to", range.to);
        return "/events?" + params.toString();
      }

      function updateFilterClearButton(button) {
        const selects = button.parentElement.querySelectorAll("select");
        button.disabled = !Array.from(selects).some((select) => select.value);
      }

      function sharedTimeID(account, suffix) {
        return (account ? "account-shared" : "shared") + "-time-" + suffix;
      }

      function rollingTimeMode(mode) {
        const match = /^(\d+)([hd])$/.exec(mode || "");
        if (!match) return null;
        const value = Number(match[1]);
        const unit = match[2] === "h" ? "hour" : "day";
        return value >= (unit === "hour" ? 5 : 1) && value <= (unit === "hour" ? 24 : 30) ? { unit, value } : null;
      }

      function timeRangeLabel(range) {
        const rolling = rollingTimeMode(range.mode);
        if (rolling) return "最近 " + rolling.value + (rolling.unit === "hour" ? " 小时" : " 天");
        if (range.mode !== "custom") return SHARED_TIME_LABELS[range.mode];
        const options = { year: "numeric", month: "2-digit", day: "2-digit" };
        if (range.unit !== "day") Object.assign(options, { hour: "2-digit", minute: "2-digit", hour12: false });
        const format = (value) => new Date(value).toLocaleString("zh-CN", options);
        const end = new Date(new Date(range.to).getTime() - 1);
        if (range.unit === "hour") end.setMinutes(0, 0, 0);
        return format(range.from) + " – " + format(end);
      }

      function updateSharedTimeControl(account, range = sharedTimeRanges[account ? "account" : "admin"]) {
        const label = timeRangeLabel(range);
        $(sharedTimeID(account, "label")).textContent = label;
        const current = $(sharedTimeID(account, "popover")).querySelector(".time-range-current");
        if (current) current.textContent = label;
      }

      function closeSharedTimePopover(account, restoreFocus = false) {
        const popover = $(sharedTimeID(account, "popover"));
        if (popover.classList.contains("hidden")) return;
        popover.classList.add("hidden");
        $(sharedTimeID(account, "backdrop")).classList.add("hidden");
        $(sharedTimeID(account, "trigger")).setAttribute("aria-expanded", "false");
        sharedTimeDrafts[account ? "account" : "admin"] = null;
        updateSharedTimeControl(account);
        if (restoreFocus) $(sharedTimeID(account, "trigger")).focus();
      }

      function localDay(date) {
        return new Date(date.getFullYear(), date.getMonth(), date.getDate()).getTime();
      }

      function shiftLocalDay(value, days) {
        const date = new Date(value);
        date.setDate(date.getDate() + days);
        return date.getTime();
      }

      function defaultCustomTimeRange(draft, unit) {
        return unit === "hour"
          ? { unit, start: draft.hours[16], end: draft.hours[23] }
          : { unit, start: shiftLocalDay(draft.today, -6), end: draft.today };
      }

      function renderCustomTimeRange(account, draft) {
        const custom = draft.custom;
        const content = el("div", { class: "time-range-custom" });
        const redraw = () => {
          const popover = $(sharedTimeID(account, "popover"));
          const focused = document.activeElement;
          const label = focused.getAttribute("aria-label") || focused.textContent;
          const matchingButtons = () =>
            Array.from(popover.querySelectorAll("button:not(:disabled)")).filter(
              (button) => (button.getAttribute("aria-label") || button.textContent) === label,
            );
          const index = matchingButtons().indexOf(focused);
          renderSharedTimePopover(account);
          const next = matchingButtons()[index];
          (next || popover.querySelector(".time-range-modes .active")).focus({ preventScroll: true });
        };
        const format = (value) =>
          new Date(value).toLocaleString(
            "zh-CN",
            custom.unit === "day"
              ? { year: "numeric", month: "short", day: "numeric" }
              : { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false },
          );
        const pickerCancel = () => {
          draft.custom = draft.snapshot;
          draft.view = "summary";
          redraw();
        };
        const apply = () => {
          const to = Math.min(Date.now(), custom.unit === "day" ? shiftLocalDay(custom.end, 1) : custom.end + 3600000);
          guard(() =>
            applyTimeRange(account, {
              mode: "custom",
              unit: custom.unit,
              from: new Date(custom.start).toISOString(),
              to: new Date(to).toISOString(),
            }),
          );
        };
        if (draft.view === "summary") {
          content.append(
            el(
              "div",
              { class: "time-range-options time-range-units", role: "group", "aria-label": "自定义单位" },
              ["hour", "day"].map((unit) =>
                el("button", {
                  type: "button",
                  class: unit === custom.unit ? "active" : "",
                  "aria-pressed": String(unit === custom.unit),
                  text: unit === "hour" ? "小时" : "天",
                  onclick: () => {
                    if (unit === custom.unit) return;
                    draft.custom = defaultCustomTimeRange(draft, unit);
                    redraw();
                  },
                }),
              ),
            ),
          );
        } else {
          content.append(
            el(
              "div",
              { class: "row spread" },
              el("button", { type: "button", class: "link small", text: "返回", onclick: pickerCancel }),
              el("span", { class: "small", text: custom.unit === "day" ? "选择日期" : "选择小时" }),
              el("span", { class: "small muted", text: Intl.DateTimeFormat().resolvedOptions().timeZone }),
            ),
          );
        }
        const endpoints = el(
          "div",
          { class: "time-range-options time-range-endpoints" + (draft.view === "summary" ? " summary" : "") },
          ["start", "end"].map((endpoint) =>
            el(
              "button",
              {
                type: "button",
                class: draft.view !== "summary" && draft.endpoint === endpoint ? "active" : "",
                "aria-label": endpoint === "start" ? "选择开始时间" : "选择结束时间",
                onclick: () => {
                  if (draft.view === "summary") draft.snapshot = { ...custom };
                  draft.endpoint = endpoint;
                  draft.view = custom.unit;
                  draft.month = new Date(custom[endpoint]);
                  draft.month.setDate(1);
                  redraw();
                },
              },
              el("span", { class: "small muted", text: endpoint === "start" ? "开始时间" : "结束时间" }),
              el("span", { text: format(custom[endpoint]) }),
              draft.view === "summary"
                ? el("span", {
                    class: "small muted",
                    text: endpoint === "end" && custom.start === custom.end ? "与开始时间相同" : "点击修改",
                  })
                : null,
            ),
          ),
        );
        if (draft.view === "summary")
          endpoints.insertBefore(el("span", { class: "muted", "aria-hidden": "true", text: "→" }), endpoints.lastChild);
        content.append(endpoints);
        if (custom.unit === "day")
          content.append(el("div", { class: "small muted", text: "可选择最近 365 天内的日期" }));
        if (draft.view === "day") {
          const month = draft.month;
          const monthStart = month.getTime();
          const nextMonth = new Date(month.getFullYear(), month.getMonth() + 1, 1).getTime();
          const moveMonth = (amount) => {
            draft.month = new Date(month.getFullYear(), month.getMonth() + amount, 1);
            redraw();
          };
          const grid = el("div", { class: "time-range-calendar time-range-options" });
          for (const name of ["日", "一", "二", "三", "四", "五", "六"])
            grid.append(el("span", { class: "small muted", text: name }));
          const first = shiftLocalDay(monthStart, -month.getDay());
          for (let i = 0; i < 42; i++) {
            const day = shiftLocalDay(first, i);
            const selected = day === custom.start || day === custom.end;
            grid.append(
              el("button", {
                type: "button",
                "data-range-day": String(day),
                class: [
                  selected ? "active" : "",
                  day === custom.start ? "range-start" : "",
                  day === custom.end ? "range-end" : "",
                  day >= custom.start && day <= custom.end ? "in-range" : "",
                  new Date(day).getMonth() !== month.getMonth() ? "outside-month" : "",
                ]
                  .filter(Boolean)
                  .join(" "),
                disabled: day < draft.firstDay || day > draft.today,
                "aria-label": new Date(day).toLocaleDateString("zh-CN"),
                "aria-pressed": String(selected),
                text: String(new Date(day).getDate()),
                onclick: () => {
                  if (draft.endpoint === "start") {
                    custom.start = day;
                    custom.end = Math.max(custom.end, day);
                    draft.endpoint = "end";
                    draft.month = new Date(custom.end);
                    draft.month.setDate(1);
                  } else {
                    custom.end = day;
                    custom.start = Math.min(custom.start, day);
                  }
                  redraw();
                },
              }),
            );
          }
          content.append(
            el(
              "div",
              { class: "row spread" },
              el("button", {
                type: "button",
                class: "link small",
                text: "上一月",
                disabled: monthStart <= draft.firstDay,
                onclick: () => moveMonth(-1),
              }),
              el("span", {
                class: "small",
                text: month.toLocaleDateString("zh-CN", { year: "numeric", month: "long" }),
              }),
              el("button", {
                type: "button",
                class: "link small",
                text: "下一月",
                disabled: nextMonth > draft.today,
                onclick: () => moveMonth(1),
              }),
            ),
            grid,
          );
        } else if (draft.view === "hour") {
          content.append(
            el(
              "div",
              { class: "time-range-hours" },
              ["start", "end"].map((endpoint) =>
                el(
                  "div",
                  {},
                  el("div", { class: "small muted", text: endpoint === "start" ? "开始时间" : "结束时间" }),
                  el(
                    "div",
                    { class: "time-range-hour-list time-range-options" },
                    draft.hours.map((hour, index) =>
                      el(
                        "button",
                        {
                          type: "button",
                          class: custom[endpoint] === hour ? "active" : "",
                          "aria-pressed": String(custom[endpoint] === hour),
                          disabled: endpoint === "start" ? index > 19 : hour < custom.start + 4 * 3600000,
                          onclick: () => {
                            custom[endpoint] = hour;
                            if (endpoint === "start") custom.end = Math.max(custom.end, hour + 4 * 3600000);
                            redraw();
                          },
                        },
                        el("span", {
                          text: new Date(hour).toLocaleDateString("zh-CN", {
                            month: "short",
                            day: "numeric",
                          }),
                        }),
                        el("span", {
                          text:
                            endpoint === "end" && index === 23
                              ? "现在"
                              : new Date(hour).toLocaleTimeString("zh-CN", {
                                  hour: "2-digit",
                                  minute: "2-digit",
                                  hour12: false,
                                }),
                        }),
                      ),
                    ),
                  ),
                ),
              ),
            ),
          );
        }
        const count =
          custom.unit === "hour"
            ? (custom.end - custom.start) / 3600000 + 1
            : Math.round((custom.end - custom.start) / 86400000) + 1;
        if (draft.view === "summary") {
          content.append(
            el(
              "div",
              { class: "row spread small muted" },
              el("span", { text: "共 " + count + (custom.unit === "hour" ? " 小时" : " 天") }),
              el("span", { text: Intl.DateTimeFormat().resolvedOptions().timeZone }),
            ),
          );
        }
        content.append(
          el(
            "div",
            { class: "row spread" },
            draft.view === "summary"
              ? null
              : el("span", { class: "small muted", text: format(custom.start) + " – " + format(custom.end) }),
            el(
              "div",
              { class: "row time-range-actions" },
              el("button", {
                type: "button",
                text: "取消",
                onclick: draft.view === "summary" ? () => closeSharedTimePopover(account, true) : pickerCancel,
              }),
              el("button", { type: "button", class: "primary", text: "应用", onclick: apply }),
            ),
          ),
        );
        return content;
      }

      function renderSharedTimePopover(account) {
        const role = account ? "account" : "admin";
        const draft = sharedTimeDrafts[role];
        const popover = $(sharedTimeID(account, "popover"));
        popover.replaceChildren(
          el(
            "div",
            { class: "row spread time-range-heading" },
            el("span", { text: "时间范围" }),
            el("span", { class: "time-range-current", text: timeRangeLabel(sharedTimeRanges[role]) }),
          ),
          el(
            "div",
            { class: "time-range-options time-range-modes", role: "group", "aria-label": "时间范围模式" },
            Object.entries(SHARED_TIME_LABELS).map(([mode, label]) =>
              el("button", {
                type: "button",
                text: label,
                "aria-pressed": String(mode === draft.mode),
                class: mode === draft.mode ? "active" : "",
                onclick: () => {
                  if (mode === "custom") resetCustomTimeDraft(account, draft);
                  draft.mode = mode;
                  draft.view = "summary";
                  renderSharedTimePopover(account);
                  popover.querySelector(".time-range-modes .active").focus();
                  if (mode !== "custom")
                    guard(() =>
                      applyTimeRange(
                        account,
                        {
                          mode: mode === "hour" || mode === "day" ? draft[mode] + (mode === "hour" ? "h" : "d") : mode,
                        },
                        false,
                      ),
                    );
                },
              }),
            ),
          ),
        );
        if (draft.mode === "custom") {
          popover.append(renderCustomTimeRange(account, draft));
          for (const list of popover.querySelectorAll(".time-range-hour-list")) {
            const selected = list.querySelector(".active");
            if (selected)
              list.scrollTop = Math.max(0, selected.offsetTop - (list.clientHeight - selected.clientHeight) / 2);
          }
        } else if (draft.mode === "hour" || draft.mode === "day") {
          const unit = draft.mode;
          const min = unit === "hour" ? 5 : 1,
            max = unit === "hour" ? 24 : 30;
          const label = unit === "hour" ? " 小时" : " 天";
          const value = el("b", { text: draft[unit] + label });
          let activePointer = null;
          const commit = () => {
            activePointer = null;
            if (sharedTimeDrafts[role] === draft && draft.mode === unit)
              guard(() => applyTimeRange(account, { mode: draft[unit] + (unit === "hour" ? "h" : "d") }, false));
          };
          const finishPointer = (event) => {
            if (activePointer === event.pointerId) commit();
          };
          const slider = el("input", {
            type: "range",
            class: "range-input",
            min,
            max,
            step: 1,
            value: draft[unit],
            style: "--range-progress:" + ((draft[unit] - min) / (max - min)) * 100 + "%",
            "aria-label": "最近" + label.trim(),
            oninput: (event) => {
              draft[unit] = Number(event.target.value);
              value.textContent = draft[unit] + label;
              updateSharedTimeControl(account, { mode: draft[unit] + (unit === "hour" ? "h" : "d") });
              event.currentTarget.style.setProperty(
                "--range-progress",
                ((draft[unit] - min) / (max - min)) * 100 + "%",
              );
            },
            onpointerdown: (event) => {
              if (activePointer !== null && activePointer !== event.pointerId) return event.preventDefault();
              activePointer = event.pointerId;
              event.currentTarget.setPointerCapture(event.pointerId);
            },
            onpointerup: finishPointer,
            onpointercancel: finishPointer,
            onkeyup: (event) => {
              if (/^(Arrow(Left|Right|Up|Down)|Home|End|PageUp|PageDown)$/.test(event.key)) commit();
            },
            onblur: commit,
          });
          const ticks = unit === "hour" ? [5, 8, 12, 18, 24] : [1, 7, 14, 21, 30];
          popover.append(
            el(
              "div",
              { class: "time-range-rolling" },
              el("div", { class: "row spread small" }, el("span", { class: "muted", text: "最近时间范围" }), value),
              el(
                "div",
                { class: "range-control" },
                slider,
                el(
                  "div",
                  { class: "range-ticks small muted", "aria-hidden": "true" },
                  ticks.map((tick) =>
                    el("span", {
                      text: String(tick),
                      style: "left:" + ((tick - min) / (max - min)) * 100 + "%",
                    }),
                  ),
                ),
              ),
            ),
          );
        } else {
          popover.append(
            el(
              "div",
              { class: "time-range-rolling" },
              el("span", { class: "small", text: SHARED_TIME_LABELS[draft.mode] }),
              el("span", {
                class: "small muted",
                text: draft.mode === "today" ? "00:00 → 现在" : "00:00 → 24:00",
              }),
            ),
          );
        }
      }

      function resetCustomTimeDraft(account, draft) {
        const range = sharedTimeChoices[account ? "account" : "admin"].custom;
        const now = new Date();
        const hour = new Date(now);
        hour.setMinutes(0, 0, 0);
        draft.today = localDay(now);
        draft.firstDay = shiftLocalDay(draft.today, -364);
        draft.hours = Array.from({ length: 24 }, (_, i) => hour.getTime() - (23 - i) * 3600000);
        draft.custom = defaultCustomTimeRange(draft, range?.unit === "hour" ? "hour" : "day");
        if (!range) return;
        const start = new Date(range.from).getTime(),
          end = new Date(range.to).getTime() - 1;
        if (range.unit === "hour") {
          const first = draft.hours.find((value) => value >= start);
          const last = draft.hours.findLast((value) => value <= end);
          if (first !== undefined && last - first >= 4 * 3600000)
            draft.custom = { unit: "hour", start: first, end: last };
        } else if (end >= draft.firstDay && start <= now.getTime()) {
          draft.custom = {
            unit: "day",
            start: Math.max(draft.firstDay, localDay(new Date(start))),
            end: Math.min(draft.today, localDay(new Date(end))),
          };
        } else {
          draft.custom = { unit: "day", start: draft.today, end: draft.today };
        }
      }

      function openSharedTimePopover(account) {
        const popover = $(sharedTimeID(account, "popover"));
        if (!popover.classList.contains("hidden")) return closeSharedTimePopover(account, true);
        closeSharedTimePopover(!account);
        const role = account ? "account" : "admin";
        const range = sharedTimeRanges[role];
        const rolling = rollingTimeMode(range.mode);
        const draft = {
          ...sharedTimeChoices[role],
          mode: rolling?.unit || range.mode,
          view: "summary",
          endpoint: "start",
        };
        if (rolling) draft[rolling.unit] = rolling.value;
        resetCustomTimeDraft(account, draft);
        sharedTimeDrafts[role] = draft;
        renderSharedTimePopover(account);
        popover.classList.remove("hidden");
        $(sharedTimeID(account, "backdrop")).classList.remove("hidden");
        $(sharedTimeID(account, "trigger")).setAttribute("aria-expanded", "true");
        popover.querySelector(".time-range-modes .active").focus();
      }

      function applyTimeRange(account, range, close = true) {
        const role = account ? "account" : "admin";
        const previous = sharedTimeRanges[role];
        sharedTimeRanges[role] = range;
        const rolling = rollingTimeMode(range.mode);
        if (rolling) sharedTimeChoices[role][rolling.unit] = rolling.value;
        if (range.mode === "custom") sharedTimeChoices[role].custom = range;
        saveViewPreference(role, "time-range", range);
        updateSharedTimeControl(account);
        if (close) closeSharedTimePopover(account, true);
        if (JSON.stringify(previous) !== JSON.stringify(range)) return applySharedTimeRange(account);
      }

      function bindSharedTimeControls(account) {
        $(sharedTimeID(account, "trigger")).onclick = () => openSharedTimePopover(account);
        $(sharedTimeID(account, "backdrop")).onclick = () => closeSharedTimePopover(account, true);
        $(sharedTimeID(account, "popover")).onkeydown = (event) => {
          if (event.key !== "Tab") return;
          const controls = Array.from(
            event.currentTarget.querySelectorAll("button:not(:disabled), input:not(:disabled)"),
          );
          const target = event.shiftKey ? controls.at(-1) : controls[0];
          if (
            !event.currentTarget.contains(document.activeElement) ||
            document.activeElement === (event.shiftKey ? controls[0] : controls.at(-1))
          ) {
            event.preventDefault();
            target.focus();
          }
        };
      }

      function csvCell(value) {
        if (value === undefined || value === null) return "";
        let text = String(value);
        if (/^[=+\-@]/.test(text)) text = "'" + text;
        return '"' + text.replaceAll('"', '""') + '"';
      }

      function requestEventCSV(entries, account) {
        const columns = account ? ACCOUNT_REQUEST_EVENT_CSV_COLUMNS : REQUEST_EVENT_CSV_COLUMNS;
        const lines = [columns.map(csvCell).join(",")];
        for (const entry of entries) {
          const row = { ...entry, ...entry.cost };
          lines.push(columns.map((column) => csvCell(row[column])).join(","));
        }
        return "\ufeff" + lines.join("\r\n") + "\r\n";
      }

      function downloadCSV(filename, content) {
        const url = URL.createObjectURL(new Blob([content], { type: "text/csv;charset=utf-8" }));
        const anchor = el("a", { href: url, download: filename });
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        setTimeout(() => URL.revokeObjectURL(url), 0);
      }

      async function exportRequestEvents(account) {
        if (requestEventExporting) return;
        requestEventExporting = true;
        const button = $(account ? "account-request-events-export" : "request-events-export");
        button.disabled = true;
        setLabeledActionIcon(button, "download", "正在导出…");
        const range = selectedRange(account);
        range.to = new Date(Math.min(Date.now(), Date.parse(range.to))).toISOString();
        const params = new URLSearchParams(
          requestEventPath(null, REQUEST_EVENT_EXPORT_BATCH_SIZE, account, range).split("?")[1],
        );
        try {
          const entries = [];
          let total = Infinity;
          while (entries.length < total) {
            params.set("offset", String(entries.length));
            const path = "/events?" + params;
            const page = account ? await accountAPI(path) : await plugin("GET", path);
            params.set("snapshot_id", page.snapshot_id);
            const incoming = page.entries || [];
            total = Number(page.total || 0);
            entries.push(...incoming);
            if (!incoming.length) break;
          }
          const stamp = new Date().toISOString().replaceAll(":", "-").slice(0, 19);
          const name = account ? "cpa-key-billing-account-request-events-" : "cpa-key-billing-request-events-";
          downloadCSV(name + stamp + ".csv", requestEventCSV(entries, account));
          notify("已导出 " + int(entries.length) + " 条请求事件");
        } finally {
          requestEventExporting = false;
          button.disabled = false;
          setLabeledActionIcon(button, "download", "导出");
        }
      }

        renderCollection(list.scroller, entries, {

      function renderPluginLogs() {
        const list = pagedList("logs");
        const note = $("plugin-log-note");
        if (!list.data) note.textContent = "";
        if (list.renderEmpty()) return;
        const pluginLogs = list.data.entries || [];
        const filter = $("plugin-log-filter").value.trim().toLowerCase();
        const currentIDs = new Set(pluginLogs.map((entry) => String(entry.id)));
        for (const id of expandedPluginLogIDs) if (!currentIDs.has(id)) expandedPluginLogIDs.delete(id);
        const searched = pluginLogs.filter((pluginLog) => {
          if (!filter) return true;
          return (pluginLog.message || "").toLowerCase().includes(filter);
        });
        const counts = {
          ...list.data.level_counts,
          all: Object.values(list.data.level_counts || {}).reduce((sum, count) => sum + count, 0),
        };
        const levelSelect = $("plugin-log-level");
        for (const option of levelSelect.options) {
          const label = option.value === "all" ? "全部级别" : pluginLogLevels[option.value].label;
          const text = label + "·" + int(counts[option.value] || 0);
          if (option.textContent !== text) option.textContent = text;
        }
        const total = counts[levelSelect.value] || 0;
        note.textContent = "已加载 " + int(pluginLogs.length) + " / " + int(total) + " 条";
        renderCollection(list.scroller, searched, {
          attrs: { class: "event-list", role: "list", "aria-label": "插件日志列表" },

      function renderPluginLogMessage(pluginLog) {
        const message = pluginLog.message || "";
        if (!message.startsWith("route ")) return el("div", { class: "plugin-log-message" }, message);
        try {
          const row = JSON.parse(message.slice(6));
          const model =
            row.model_result === "deny" ? "拒绝" : row.model_result === "configuration_error" ? "配置错误" : "允许";
          const credential =
            row.credential_result === "selected"
              ? "上游凭证：" + (sourceLabel(row.selected_credential) || "未知")
              : row.credential_result === "no_match"
                ? "上游凭证：无符合条件的可用凭证"
                : row.credential_result === "not_reached"
                  ? "上游凭证：未进入选择阶段"
                  : row.credential_result === "not_observed"
                    ? "上游凭证：未观察到选择结果"
                    : row.credential_result === "configuration_error"
                      ? "上游凭证：配置错误"
                      : "上游凭证：全部上游凭证";
          const outcome =
            { succeeded: "成功", failed: "失败", rejected: "已拒绝", canceled: "已取消" }[row.outcome] ||
            row.outcome ||
            "未知";
          const id = String(pluginLog.id);
          return el(
            "details",
            {
              class: "plugin-log-message",
              open: expandedPluginLogIDs.has(id),
              ontoggle: (event) => {
                if (!event.currentTarget.isConnected) return;
                if (event.currentTarget.open) expandedPluginLogIDs.add(id);

            el(
